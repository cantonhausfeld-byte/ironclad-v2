[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ironclad-v2"
version = "0.1.0"
description = "Unified NFL matchup forecasting system"
requires-python = ">=3.11"
dependencies = [
    "click>=8.1",
    "duckdb>=0.10",
    "pandas>=2.1",
    "numpy>=1.26",
    "pyarrow>=14.0",
    "xgboost>=2.0",
    "scikit-learn>=1.4",
    "nfl-data-py>=0.3",
    "nflreadpy>=0.1",
    "jinja2>=3.1",
    "requests>=2.31",
    "python-dotenv>=1.0",
    "tqdm>=4.66",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=4.0", "hypothesis>=6.0"]

[project.scripts]
ironclad = "cli.main:cli"

[tool.setuptools.packages.find]
where = ["."]
include = ["ironclad*", "cli*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.coverage.run]
source = ["ironclad"]
omit = ["tests/*"]
